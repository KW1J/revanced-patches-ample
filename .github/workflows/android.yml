name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

      permissions:
  contents: read
  packages: read

  - name: Configure Gradle credentials
  run: |
    mkdir -p ~/.gradle
    {
      echo "gpr.user=${GITHUB_ACTOR}"
      echo "gpr.key=${GITHUB_TOKEN}"
    } >> ~/.gradle/gradle.properties
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


